[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wine-yield"
version = "0.1.0"
description = "Cabernet Sauvignon yield data loading pipeline"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[tool.setuptools.packages.find]
include = ["wine_data*"]
